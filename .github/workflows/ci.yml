# دوال اللياقة بالـ CI (Fundamentals of Software Architecture؛ Pragmatic: «اختبر بلا رحمة»)
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: lp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:pg@localhost:5432/lp_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:pg@localhost:5432/lp_test
      TEST_DATABASE_URL: postgresql://postgres:pg@localhost:5432/lp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: الأنواع
        run: npx tsc --noEmit
      - name: قواعد المعمارية (ESLint)
        run: npx eslint src --max-warnings 10
      - name: المخطط مطابق للـ migrations
        run: npx prisma migrate deploy && npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: الاختبارات (وحدة + خصائص + تكامل)
        run: npx vitest run
